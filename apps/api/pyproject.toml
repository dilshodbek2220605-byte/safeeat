[project]
name = "safeeat-api"
version = "0.1.0"
description = "SafeEat AI — Telegram Mini App backend (FastAPI + SQLAlchemy async)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "greenlet>=3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "Pillow>=10.4",
    "PyJWT>=2.8",
    "redis>=5.0",
    "boto3>=1.34",
    "aiogram>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# Konfiguratsiyadagi placeholder qiymatlar "maxfiy" deb hisoblanmasin
"app/core/config.py" = ["S105", "S106"]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
